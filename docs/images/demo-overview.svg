<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="title desc">
<title id="title">AI Energy: synthetic price forecast and load schedule</title>
<desc id="desc">First twelve hours of the reproducible tools/demo.py output. Fictional forecast retail prices, in cents per kWh, fall towards 06:00 UTC. Hot water is planned from 05:00 to 07:00, heating from 05:30 to 06:30, and EV charging from 06:30 to 09:50. The shared power limit is 4.6 kW. This is an advisory demonstration, not a Home Assistant dashboard or evidence of savings.</desc>
