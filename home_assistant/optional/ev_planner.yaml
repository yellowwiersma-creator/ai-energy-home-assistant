# Advanced EV planner recipe, adapted from the complete working 33-automation package.
# All automations are disabled and the master authorization resets OFF at HA start.
# Every service call rechecks that master, including nested scripts and calls after waits.
# This file is an inactive adapter recipe. Review native charger modes and Kia UVO
# service/limit-confirmation behavior before any expert-led activation.
