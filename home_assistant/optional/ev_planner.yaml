    entity_id: sensor.ai_kia_werk_laadadvies
    to: Handmatig plannen
  - trigger: state
    entity_id: sensor.ai_kia_werk_laadadvies
    to: Nu laden
  - trigger: state
    entity_id: sensor.ai_kia_werk_laadadvies
    to: Klaar
  - trigger: state
    entity_id: sensor.ai_kia_werk_laadadvies
    to: Wachten
  - trigger: state
    entity_id: sensor.ai_kia_werk_laadadvies
    to: Geen werkrit
  - trigger: state
    entity_id: sensor.ai_kia_werk_laadadvies
    to: SOC verversen
  - trigger: state
    entity_id: input_boolean.ai_kia_automatisch_laden_toestaan
    to: 'on'
  - trigger: state
    entity_id: sensor.ev_charger_status
    to: suspended
  - trigger: state
    entity_id: sensor.ev_charger_status
    to: charging
  - trigger: time_pattern
    minutes: /1
  - trigger: state
    entity_id: sensor.ai_kia_laaddoel_bevestiging
    to: Bevestigd door Kia
  - trigger: state
    entity_id: sensor.ai_kia_laaddoel_bevestiging
    to: Wacht op Kia
  conditions:
  - condition: template
    value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
    alias: Advanced recipe master authorization is still enabled
  - condition: template
    value_template: "{{\n  is_state('input_boolean.ai_kia_automatisch_laden_toestaan', 'on')\n  or\n  (\n    is_state('input_boolean.ai_kia_direct_laden_actief',\
      \ 'on')\n    and not is_state('input_select.ai_kia_laadmodus', 'Automatisch')\n  )\n}}\n"
  - condition: state
    entity_id: input_boolean.ai_kia_sessie_actief
    state: 'on'
  - condition: template
    value_template: "{{\n  states('sensor.ev_charger_status')\n  in ['suspended', 'charging']\n}}\n"
  - condition: state
    entity_id: binary_sensor.ai_kia_soc_is_betrouwbaar
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '

          {% set m=state_attr(''sensor.ai_kia_laaddoel_bevestiging'',''model'') or {} %}

          {% set doel=states(''sensor.ai_kia_effectief_doelpercentage'')|float(-1) %}

          {% set wacht=m.get(''hold'',false) and m.get(''goal'')==doel and m.get(''session'')==states(''input_datetime.ai_kia_sessie_aangesloten_op'')
          and is_state(''input_boolean.ai_kia_sessie_actief'',''on'') and states(''sensor.ev_charger_status'') in
          [''suspended'',''charging''] %}


          {% set m=state_attr(''sensor.ai_kia_laaddoel_bevestiging'',''model'') or {} %}

          {% set doel=states(''sensor.ai_kia_effectief_doelpercentage'')|float(-1) %}

          {% set bevestigd=m.get(''soc'') is number and 1<=doel<=100 and m.soc>=doel and m.get(''session'')==states(''input_datetime.ai_kia_sessie_aangesloten_op'')
          and is_state(''input_boolean.ai_kia_sessie_actief'',''on'') and states(''sensor.ev_charger_status'') in
          [''suspended'',''charging''] %}

          {{ bevestigd or wacht }}'
      - condition: state
        entity_id: switch.ev_charger_authorize
        state: 'on'
      - condition: state
        entity_id: input_boolean.ai_kia_voorverwarming_actief
        state: 'off'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.ev_charger_authorize
    - conditions:
      - condition: template
        alias: Geen startpoging als Kia het laaddoel heeft bevestigd
        value_template: '

          {% set m=state_attr(''sensor.ai_kia_laaddoel_bevestiging'',''model'') or {} %}

          {% set doel=states(''sensor.ai_kia_effectief_doelpercentage'')|float(-1) %}

          {% set wacht=m.get(''hold'',false) and m.get(''goal'')==doel and m.get(''session'')==states(''input_datetime.ai_kia_sessie_aangesloten_op'')
          and is_state(''input_boolean.ai_kia_sessie_actief'',''on'') and states(''sensor.ev_charger_status'') in
          [''suspended'',''charging''] %}


          {% set m=state_attr(''sensor.ai_kia_laaddoel_bevestiging'',''model'') or {} %}

          {% set doel=states(''sensor.ai_kia_effectief_doelpercentage'')|float(-1) %}

          {% set bevestigd=m.get(''soc'') is number and 1<=doel<=100 and m.soc>=doel and m.get(''session'')==states(''input_datetime.ai_kia_sessie_aangesloten_op'')
          and is_state(''input_boolean.ai_kia_sessie_actief'',''on'') and states(''sensor.ev_charger_status'') in
          [''suspended'',''charging''] %}

          {{ not bevestigd and not wacht }}'
      - condition: template
        value_template: "\n{% set gepland =\n  as_timestamp(\n    states('input_text.ai_kia_vast_plan_start'),\n\
          \    0\n  )\n%}\n{% set vertrek =\n  as_timestamp(\n    states('input_text.ai_kia_werkrit_start'),\n \
          \   0\n  )\n%}\n{% set nodig =\n  states('sensor.ai_kia_kwh_nodig')\n  | float(0)\n%}\n{{\n  states('sensor.ai_kia_werk_laadadvies')\n\
          \  in [\n    'Laden goedkoop',\n    'Laden verplicht',\n    'Laden handmatig',\n    'Nu laden'\n  ]\n\
          \  or\n  (\n    gepland > 0\n    and as_timestamp(now()) >= gepland - 60\n    and\n    (\n      vertrek\
          \ > as_timestamp(now())\n      or is_state('input_select.ai_kia_laadmodus', 'Klaar om')\n    )\n    and\
          \ nodig > 0.1\n  )\n}}\n"
      - condition: template
        alias: Peblar starten of slapende Kia na afkoeltijd opnieuw wekken
        value_template: "{% set peb_off = is_state('switch.ev_charger_authorize', 'off') %} {% set gesuspendeerd\
          \ =\n  is_state('switch.ev_charger_authorize', 'on')\n  and states('sensor.ev_charger_status') == 'suspended'\n\
          \  and states('sensor.ev_charger_power') | float(0) < 500\n%} {% set laatste =\n  as_timestamp(states('input_datetime.ai_kia_laatste_startpoging'),\
          \ 0)\n%} {{\n  peb_off\n  or\n  (\n    gesuspendeerd\n    and\n    (\n      laatste <= 0\n      or as_timestamp(now())\
          \ - laatste >= 600\n    )\n  )\n}}\n"
      - condition: template
        alias: Minimum uit-tijd, behalve wanneer het laadplan nu moet starten
        value_template: "{% set gestopt =\n  as_timestamp(states('input_datetime.ai_kia_laden_gestopt_op'), 0)\n\
          %} {% set gepland =\n  as_timestamp(states('input_text.ai_kia_vast_plan_start'), 0)\n%} {% set advies\
          \ = states('sensor.ai_kia_werk_laadadvies') %} {{\n  gestopt <= 0\n  or as_timestamp(now()) - gestopt\
          \ >= 600\n  or advies in ['Laden verplicht', 'Nu laden']\n  or (gepland > 0 and as_timestamp(now()) >=\
          \ gepland - 60)\n}}\n"
      - condition: template
        alias: Eerst afwachten wanneer Kia nabij het doel geen vermogen vraagt
        value_template: '

          {% set goal=states(''sensor.ai_kia_effectief_doelpercentage'')|float(-1) %}

          {% set estimate=states(''sensor.ai_kia_soc_betrouwbaar'')|float(-1) %}

          {% set limit=states(''number.ev_cloud_ac_limit'')|float(-1) %}

          {% set near=1<=goal<=100 and 0<=estimate<=100 and estimate>=goal-1 and limit==goal %}


          {% set energy=states(''sensor.ev_charger_session_energy'')|float(-1) %}

          {% set baseline=states(''input_number.ai_kia_sessie_start_energie'')|float(-1) %}

          {% set charged=energy-baseline if energy>=baseline else energy %}

          {% set power=states(''sensor.ev_charger_power'')|float(-1) %}

          {% set power_age=as_timestamp(now())-as_timestamp(states.sensor.ev_charger_power.last_reported,0) %}

          {% set update=as_timestamp(states(''sensor.ev_cloud_updated_at''),0) %}

          {% set soc=states(''sensor.ev_cloud_soc'')|float(-1) %}

          {% set lower=0<=soc<goal-1 and update>=as_timestamp(states(''input_datetime.ai_kia_sessie_aangesloten_op''),0)
          and 0<=as_timestamp(now())-update<=1800 %}

          {{ not (near and not lower and baseline>=0 and charged>0.05 and is_state(''switch.ev_charger_authorize'',''on'')
          and is_state(''sensor.ev_charger_status'',''suspended'') and 0<=power<100 and 0<=power_age<180) }}

          '
      sequence:
      - variables:
          kia_start_mode: '{{ states(''input_select.ai_kia_laadmodus'') }}'
          kia_start_session: '{{ states(''input_datetime.ai_kia_sessie_aangesloten_op'') }}'
          kia_start_goal: '{{ states(''sensor.ai_kia_effectief_doelpercentage'')|float(-1) }}'
          kia_start_plan: '{{ states(''input_text.ai_kia_vast_plan_start'') }}'
          kia_start_plan_rit: '{{ states(''input_text.ai_kia_plan_rit_start'') }}'
          kia_start_now_button: '{{ states(''input_button.ai_kia_nu_laden'') }}'
          kia_start_stop_button: '{{ states(''input_button.ai_kia_direct_laden_stoppen'') }}'
          kia_start_direct: '{{ states(''input_boolean.ai_kia_direct_laden_actief'') }}'
          kia_start_allowed: '{{ states(''input_boolean.ai_kia_automatisch_laden_toestaan'') }}'
      - if:
        - condition: template
          value_template: '{{ kia_start_mode == ''Automatisch'' }}'
        then:
        - if:
          - condition: not
            conditions:
            - condition: and
              conditions:
              - condition: template
                value_template: '{% set last=as_timestamp(states(''input_datetime.ai_kia_laatste_startpoging''),0)
                  %}

                  {{ last<=0 or as_timestamp(now())-last>=600 }}'
                alias: Tien minuten tussen automatische startpogingen
          then:
          - stop: Automatische startpoging wacht op de afkoeltijd van tien minuten
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ai_kia_laatste_startpoging
            data:
              datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        - if:
          - condition: template
            value_template: '{% set valid = (states(''number.ev_cloud_ac_limit'')|float(-1)) %}{{ valid<0 }}'
          then:
          - if:
            - condition: template
              value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
              alias: Advanced recipe master authorization is still enabled
            then:
            - action: persistent_notification.create
              data:
                notification_id: ai_kia_ac_limiet_niet_bevestigd
                title: Kia-laadlimiet nog niet bevestigd
                message: De Kia AC-laadlimiet is niet beschikbaar. De Peblar wordt niet gestart; de planner probeert
                  het na tien minuten opnieuw.
          - stop: Kia AC-laadlimiet niet beschikbaar
        - variables:
            kia_goal_supported: '{% set goal=kia_start_goal|float(-1) %}

              {% set low=state_attr(''number.ev_cloud_ac_limit'',''min'')|float(-1) %}

              {% set high=state_attr(''number.ev_cloud_ac_limit'',''max'')|float(-1) %}

              {% set step=state_attr(''number.ev_cloud_ac_limit'',''step'')|float(-1) %}

              {% set increments=(goal-low)/step if step>0 else -1 %}

              {{ 0<low<=goal<=high<=100 and step>0 and increments>=0

              and (increments-increments|round(0))|abs<0.000001 }}'
        - if:
          - condition: template
            value_template: '{{ not kia_goal_supported }}'
          then:
          - if:
            - condition: template
              value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
              alias: Advanced recipe master authorization is still enabled
            then:
            - action: persistent_notification.create
              data:
                notification_id: ai_kia_ac_limiet_niet_bevestigd
                title: Kia-laadlimiet nog niet bevestigd
                message: Het geplande doel van {{ kia_start_goal }}% past niet bij de beschikbare Kia-laadlimieten
                  ({{ state_attr("number.ev_cloud_ac_limit","min") }}–{{ state_attr("number.ev_cloud_ac_limit","max")
                  }}%, stappen van {{ state_attr("number.ev_cloud_ac_limit","step") }}%). Het doel is niet afgerond
                  en laden is niet gestart.
          - stop: Gepland doel is geen ondersteunde Kia AC-laadlimiet
        - variables:
            kia_limit_already_fresh: '{% set t=as_timestamp(now()) %}

              {% set updated=as_timestamp(states(''sensor.ev_cloud_updated_at''),0) %}

              {% set reported=as_timestamp(states.number.ev_cloud_ac_limit.last_reported,0) %}

              {{ states(''number.ev_cloud_ac_limit'')|float(-1)==kia_start_goal|float(-2)

              and updated>=as_timestamp(kia_start_session,0)>0

              and 0<=t-updated<180 and 0<=t-reported<180 }}'
        - if:
          - condition: template
            value_template: '{{ not kia_limit_already_fresh }}'
          then:
          - if:
            - condition: not
              conditions:
              - condition: and
                conditions:
                - condition: template
                  value_template: '{{ states(''input_select.ai_kia_laadmodus'') == kia_start_mode

                    and states(''input_datetime.ai_kia_sessie_aangesloten_op'') == kia_start_session

                    and states(''sensor.ai_kia_effectief_doelpercentage'')|float(-1) == kia_start_goal|float(-2)

                    and states(''input_text.ai_kia_vast_plan_start'') == kia_start_plan

                    and states(''input_text.ai_kia_plan_rit_start'') == kia_start_plan_rit

                    and states(''input_button.ai_kia_nu_laden'') == kia_start_now_button

                    and states(''input_button.ai_kia_direct_laden_stoppen'') == kia_start_stop_button

                    and states(''input_boolean.ai_kia_direct_laden_actief'') == kia_start_direct

                    and states(''input_boolean.ai_kia_automatisch_laden_toestaan'') == kia_start_allowed }}'
                  alias: Dezelfde laadopdracht; nieuw handmatig ingrijpen heeft voorrang
                - condition: template
                  value_template: "{{\n  is_state('input_boolean.ai_kia_automatisch_laden_toestaan', 'on')\n  or\n\
                    \  (\n    is_state('input_boolean.ai_kia_direct_laden_actief', 'on')\n    and not is_state('input_select.ai_kia_laadmodus',\
                    \ 'Automatisch')\n  )\n}}\n"
                - condition: state
                  entity_id: input_boolean.ai_kia_sessie_actief
                  state: 'on'
                - condition: template
                  value_template: "{{\n  states('sensor.ev_charger_status')\n  in ['suspended', 'charging']\n}}\n"
                - condition: state
                  entity_id: binary_sensor.ai_kia_soc_is_betrouwbaar
                  state: 'on'
                - condition: template
