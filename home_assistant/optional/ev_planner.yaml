template:
- sensor:
  - name: AI Kia Volledige Prijsvoorspelling Uren
    unique_id: ai_kia_volledige_prijsvoorspelling_uren
    icon: mdi:cash-clock
    state: "{% set rows =\n  state_attr(\n    'sensor.ai_energy_v11_dashboard_data',\n    'forecast'\n  )\n  | default([],\
      \ true)\n%} {% if rows | count >= 380 %}\n  ok\n{% elif rows | count > 0 %}\n  gedeeltelijk\n{% else %}\n\
      \  geen_prijzen\n{% endif %}\n"
    attributes:
      predictions: "{% set rows = state_attr('sensor.ai_energy_v11_dashboard_data', 'forecast') | default([], true)\
        \ %}\n{% set valid_unit = state_attr('sensor.ai_energy_v11_dashboard_data', 'retail_unit') == 'ct/kWh' and\
        \ state_attr('sensor.ai_energy_v11_dashboard_data', 'interval_minutes') == 15 %}\n{% set ns = namespace(out=[],\
        \ previous=none) %}\n{% if valid_unit %}\n  {% for row in rows %}\n    {% set start = as_timestamp(row.timestamp\
        \ | default(none), 0) %}\n    {% set raw_price = row.retail_cent | default(none) %}\n    {% if start > 0\
        \ and raw_price is not boolean and is_number(raw_price) and (ns.previous is none or start > ns.previous)\
        \ %}\n      {% set ns.out = ns.out + [{'start': start | timestamp_utc, 'end': (start + 900) | timestamp_utc,\
        \ 'price': (raw_price | float / 100) | round(7), 'source': row.source | default('unknown'), 'confidence':\
        \ row.confidence | default('unknown')}] %}\n      {% set ns.previous = start %}\n    {% endif %}\n  {% endfor\
        \ %}\n{% endif %}\n{{ ns.out }}"
      bronbeleid: 'AI Energy V11 retailforecast; bekende markt waar beschikbaar, AI voor de onbekende horizon

        '
      v11_core_ready: '{{ state_attr(''sensor.ai_energy_v11_dashboard_data'', ''core_ready'') | default(false, true)
        }}

        '
      bekende_kwartieren: '{{ state_attr(''sensor.ai_energy_v11_dashboard_data'', ''known_market_slots'') | int(0)
        }}

        '
      ai_kwartieren: '{{ state_attr(''sensor.ai_energy_v11_dashboard_data'', ''ai_market_slots'') | int(0) }}

        '
      marktmodel: '{{ state_attr(''sensor.ai_energy_v11_dashboard_data'', ''market_model'') | default(''onbekend'',
        true) }}

        '
      retailmodel: '{{ state_attr(''sensor.ai_energy_v11_dashboard_data'', ''retail_model'') | default(''onbekend'',
        true) }}

        '
    availability: '{{ state_attr(''sensor.ai_energy_v11_dashboard_data'', ''retail_unit'') == ''ct/kWh'' and state_attr(''sensor.ai_energy_v11_dashboard_data'',
      ''interval_minutes'') == 15 }}'
  - name: AI Kia Actuele Terugleverwaarde
    unique_id: ai_kia_actuele_terugleverwaarde
    icon: mdi:solar-power
    unit_of_measurement: €/kWh
    state: "{% set zonneplan =\n  state_attr(\n    'sensor.energy_current_tariff',\n    'forecast'\n  )\n  | default([],\
      \ true)\n%}\n{% set volledig =\n  states(\n    'sensor.energy_current_tariff'\n  )\n  | float(0)\n%}\n{% set\
      \ nu = as_timestamp(now()) %} {% set ns = namespace(\n  prijs=volledig,\n  gevonden=false\n) %}\n{% for row\
      \ in zonneplan %}\n  {% set begin =\n    as_timestamp(row.start_date, 0)\n  %}\n\n  {% if\n    begin <= nu\
      \ < begin + 3600\n    and row.electricity_price_excl_tax is defined\n  %}\n    {% set ns.prijs =\n      (\n\
      \        row.electricity_price_excl_tax\n        | float(0)\n      )\n      / 10000000\n    %}\n    {% set\
      \ ns.gevonden = true %}\n  {% endif %}\n{% endfor %}\n{{ ns.prijs | round(7) }}\n"
    attributes:
      bron: "{% set zonneplan =\n  state_attr(\n    'sensor.energy_current_tariff',\n    'forecast'\n  )\n  | default([],\
        \ true)\n%} {% set nu = as_timestamp(now()) %} {% set ns = namespace(gevonden=false) %} {% for row in zonneplan\
        \ %}\n  {% set begin =\n    as_timestamp(row.start_date, 0)\n  %}\n  {% if\n    begin <= nu < begin + 3600\n\
        \    and row.electricity_price_excl_tax is defined\n  %}\n    {% set ns.gevonden = true %}\n  {% endif %}\n\
        {% endfor %} {{\n  'zonneplan_exclusief_belasting'\n  if ns.gevonden\n  else 'conservatief_volledig_tarief'\n\
        }}\n"
  - name: AI Kia EV Netvermogen
    unique_id: ai_kia_ev_netvermogen
    icon: mdi:transmission-tower-import
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    state: "{% set ev =\n  [\n    states('sensor.ev_charger_power')\n    | float(0),\n    0\n  ]\n  | max\n%} {%\
      \ set net_status =\n  states('sensor.home_grid_import_power')\n%} {% if net_status in ['unknown', 'unavailable',\
      \ ''] %}\n  {{ ev | round(0) }}\n{% else %}\n  {% set net = [net_status | float(0), 0] | max %}\n  {{ [ev,\
      \ net] | min | round(0) }}\n{% endif %}\n"
  - name: AI Kia EV Zonvermogen
    unique_id: ai_kia_ev_zonvermogen
    icon: mdi:solar-power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    state: "{% set ev =\n  [\n    states('sensor.ev_charger_power')\n    | float(0),\n    0\n  ]\n  | max\n%} {%\
      \ set net =\n  [\n    states('sensor.ai_kia_ev_netvermogen')\n    | float(ev),\n    0\n  ]\n  | max\n%} {{\
      \ [ev - net, 0] | max | round(0) }}\n"
  - name: AI Kia Effectief Doelpercentage
    unique_id: ai_kia_effectief_doelpercentage
    icon: mdi:battery-charging-high
    unit_of_measurement: '%'
    state: "{% set handmatig =\n  states('input_select.ai_kia_laadmodus') in ['Handmatig', 'Klaar om']\n  or is_state('input_boolean.ai_kia_direct_laden_actief',\
      \ 'on')\n%} {% if handmatig %}\n  {{ states('input_number.ai_kia_handmatig_doelpercentage') | float(80) |\
      \ round(0) }}\n{% elif is_state('input_boolean.ai_kia_100_procent_onderhoud_actief', 'on') %}\n  100\n{% else\
      \ %}\n  {{ states('input_number.ai_kia_doelpercentage') | float(80) | round(0) }}\n{% endif %}\n"
    attributes:
      laadmodus: '{{ states(''input_select.ai_kia_laadmodus'') }}

        '
      agenda_doel: '{{ states(''input_number.ai_kia_doelpercentage'') }}

        '
      handmatig_doel: '{{ states(''input_number.ai_kia_handmatig_doelpercentage'') }}

        '
      handmatig_actief: "{{\n  states('input_select.ai_kia_laadmodus') in ['Handmatig', 'Klaar om']\n  or is_state('input_boolean.ai_kia_direct_laden_actief',\
        \ 'on')\n}}\n"
      vaste_tijd_actief: '{{ is_state(''input_select.ai_kia_laadmodus'', ''Klaar om'') }}

        '
      handmatige_eindtijd: '{{ states(''input_datetime.ai_kia_handmatige_eindtijd'') }}

        '
      handmatig_plan_einde: '{{ states(''input_text.ai_kia_handmatig_plan_einde'') }}

        '
      direct_laden_actief: '{{ is_state(''input_boolean.ai_kia_direct_laden_actief'', ''on'') }}

        '
      onderhoud_100_actief: '{{ is_state(''input_boolean.ai_kia_100_procent_onderhoud_actief'', ''on'') }}

        '
  - name: AI Kia SOC Betrouwbaar
    unique_id: ai_kia_soc_betrouwbaar
    icon: mdi:battery-check
    unit_of_measurement: '%'
    state: "{% if is_state('binary_sensor.ai_kia_wican_soc_actueel', 'on') %}\n{{ states('sensor.ai_kia_wican_soc')\
      \ | float | round(1) }}\n{% else %}\n\n{% set m=state_attr('sensor.ai_kia_laaddoel_bevestiging','model') or\
      \ {} %}\n{% set doel=states('sensor.ai_kia_effectief_doelpercentage')|float(-1) %}\n{% set bevestigd=m.get('soc')\
      \ is number and 1<=doel<=100 and m.soc>=doel and m.get('session')==states('input_datetime.ai_kia_sessie_aangesloten_op')\
      \ and is_state('input_boolean.ai_kia_sessie_actief','on') and states('sensor.ev_charger_status') in ['suspended','charging']\
      \ %}\n{% if bevestigd %}\n{{ m.soc|round(1) }}\n{% else %}\n\n{% set bevestigd =\n  states('input_number.ai_kia_soc_laatst_bevestigd')\n\
      \  | float(0)\n%}\n{% set start_soc =\n  states('input_number.ai_kia_sessie_start_soc')\n  | float(bevestigd)\n\
      %}\n{% set start_kwh =\n  states('input_number.ai_kia_sessie_start_energie')\n  | float(0)\n%}\n{% set nu_kwh\
      \ =\n  states('sensor.ev_charger_session_energy')\n  | float(0)\n%}\n{% set kwh_pct =\n  states('input_number.ai_kia_kwh_per_procent')\n\
      \  | float(0.704)\n%}\n{% set verbonden =\n  states('sensor.ev_charger_status')\n  in ['suspended', 'charging']\n\
      %}\n{% if\n  is_state('input_boolean.ai_kia_soc_bevestigd', 'on')\n  and verbonden\n%}\n\n  {% if nu_kwh >=\
      \ start_kwh %}\n    {% set geladen = nu_kwh - start_kwh %}\n  {% else %}\n    {% set geladen = nu_kwh %}\n\
      \  {% endif %}\n\n  {% if kwh_pct > 0 %}\n    {% set geschat =\n      start_soc + (geladen / kwh_pct)\n  \
      \  %}\n  {% else %}\n    {% set geschat = start_soc %}\n  {% endif %}\n\n  {{ [[geschat, 100] | min, 0] |\
      \ max | round(1) }}\n\n{% else %}\n\n  {% set kia =\n    states('sensor.ev_cloud_soc')\n    | float(-1)\n\
      \  %}\n\n  {{ kia | round(1) if 0 <= kia <= 100 else 0 }}\n\n{% endif %}\n\n{% endif %}\n{% endif %}"
    attributes:
      bevestigd_op: '{{ states(''input_datetime.ai_kia_soc_laatst_bevestigd_op'') }}

        '
      basis_soc: '{{ states(''input_number.ai_kia_sessie_start_soc'') }}

        '
      basis_energie_kwh: '{{ states(''input_number.ai_kia_sessie_start_energie'') }}

        '
      geladen_sinds_basis_kwh: "\n{% set start =\n  states('input_number.ai_kia_sessie_start_energie')\n  | float(0)\n\
