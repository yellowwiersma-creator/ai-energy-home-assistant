      \ - 600\n}}\n"
    timeout: 00:05:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  states(\n    'sensor.ev_cloud_updated_at'\n  )\n  == vorige_update\n}}\n"
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: persistent_notification.create
