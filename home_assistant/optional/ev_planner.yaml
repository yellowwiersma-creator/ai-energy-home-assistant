                  alias: Dezelfde laadopdracht; nieuw handmatig ingrijpen heeft voorrang
                - condition: template
                  value_template: "{{\n  is_state('input_boolean.ai_kia_automatisch_laden_toestaan', 'on')\n  or\n\
