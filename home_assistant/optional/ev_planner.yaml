- id: ai_kia_direct_laden_automatisch_beeindigen
  alias: AI Kia direct laden automatisch beëindigen
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.ai_kia_geschat_doel_bereikt
    to: 'on'
  - trigger: state
    entity_id: sensor.ev_charger_status
    to: no_ev_connected
  - trigger: state
    entity_id: input_boolean.ai_kia_direct_laden_actief
    to: 'on'
  - trigger: state
    entity_id: sensor.ai_kia_laaddoel_bevestiging
    to: Bevestigd door Kia
  - trigger: state
    entity_id: sensor.ai_kia_soc_betrouwbaar
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: template
    value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
    alias: Advanced recipe master authorization is still enabled
  - condition: state
    entity_id: input_boolean.ai_kia_direct_laden_actief
    state: 'on'
  - condition: state
    entity_id: input_select.ai_kia_laadmodus
    state: Handmatig
  actions:
  - variables:
      manual_goal: '{{ states(''input_number.ai_kia_handmatig_doelpercentage'')|float(-1) }}'
      manual_session: '{{ states(''input_datetime.ai_kia_sessie_aangesloten_op'') }}'
      manual_button: '{{ states(''input_button.ai_kia_nu_laden'') }}'
      manual_start: '{{ states(''input_text.ai_kia_vast_plan_start'') }}'
      manual_complete: '{% set goal=states(''input_number.ai_kia_handmatig_doelpercentage'')|float(-1) %}

        {% set soc=states(''sensor.ai_kia_soc_betrouwbaar'')|float(-1) %}

        {% set session=states(''input_datetime.ai_kia_sessie_aangesloten_op'') %}

        {% set session_ts=as_timestamp(session,0) %}

        {% set now_s=as_timestamp(now()) %}

        {% set age=now_s-as_timestamp(states.sensor.ai_kia_soc_betrouwbaar.last_reported,0) %}

        {% set m=state_attr(''sensor.ai_kia_laaddoel_bevestiging'',''model'') or {} %}

        {% set estimate=is_state(''binary_sensor.ai_kia_soc_is_betrouwbaar'',''on'') and 0<=soc<=100 and soc>=goal
        and 0<=age<180 %}

        {% set cloud_soc=states(''sensor.ev_cloud_soc'')|float(-1) %}

        {% set cloud_at=as_timestamp(states(''sensor.ev_cloud_updated_at''),0) %}

        {% set newer_lower=0<=cloud_soc<goal and cloud_at>=m.get(''at'',0)|float(0) and cloud_at>=session_ts and
        0<=now_s-cloud_at<=1800 %}

        {% set confirmed=m.get(''session'')==session and m.get(''soc'') is number and m.soc>=goal and m.get(''at'',0)|float(0)>=session_ts
        and 0<=now_s-m.get(''observed'',0)|float(0)<180 and not newer_lower %}

        {{ 1<=goal<=100 and session_ts>0 and is_state(''input_boolean.ai_kia_sessie_actief'',''on'') and states(''sensor.ev_charger_status'')
        in [''charging'',''suspended''] and (estimate or confirmed) }}'
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.ev_charger_status
        state: no_ev_connected
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.ai_kia_direct_laden_actief
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: input_text.set_value
          target:
            entity_id:
            - input_text.ai_kia_vast_plan_start
            - input_text.ai_kia_handmatig_plan_einde
            - input_text.ai_kia_plan_rit_start
          data:
            value: ''
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: input_number.set_value
          target:
            entity_id:
            - input_number.ai_kia_plan_gemiddelde_prijs
            - input_number.ai_kia_plan_blokken
          data:
            value: 0
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: persistent_notification.dismiss
          data:
            notification_id: ai_kia_eenmalig_stop_niet_bevestigd
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: input_select.select_option
          target:
            entity_id: input_select.ai_kia_laadmodus
          data:
            option: Automatisch
    - conditions:
      - condition: template
        value_template: '{{ manual_complete }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.ev_charger_authorize
          continue_on_error: true
      - wait_template: '{% set p=states(''sensor.ev_charger_power'')|float(-1) %}

          {% set age=as_timestamp(now())-as_timestamp(states.sensor.ev_charger_power.last_reported,0) %}

          {{ is_state(''switch.ev_charger_authorize'',''off'') and states(''sensor.ev_charger_status'') in [''suspended'',''no_ev_connected'']
          and 0<=p<100 and 0<=age<180 }}'
        timeout: 00:00:30
        continue_on_timeout: true
      - condition: template
        value_template: '{{ is_state(''input_boolean.ai_kia_direct_laden_actief'',''on'')

          and is_state(''input_select.ai_kia_laadmodus'',''Handmatig'')

          and states(''input_number.ai_kia_handmatig_doelpercentage'')|float(-1)==manual_goal|float(-2)

          and states(''input_datetime.ai_kia_sessie_aangesloten_op'')==manual_session

          and states(''input_button.ai_kia_nu_laden'')==manual_button

          and states(''input_text.ai_kia_vast_plan_start'')==manual_start }}'
      - if:
        - condition: template
          value_template: '{{ wait.completed }}'
        then:
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: input_text.set_value
            target:
              entity_id:
              - input_text.ai_kia_vast_plan_start
              - input_text.ai_kia_handmatig_plan_einde
              - input_text.ai_kia_plan_rit_start
            data:
              value: ''
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: input_number.set_value
            target:
              entity_id:
              - input_number.ai_kia_plan_gemiddelde_prijs
              - input_number.ai_kia_plan_blokken
            data:
              value: 0
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: persistent_notification.dismiss
            data:
              notification_id: ai_kia_eenmalig_stop_niet_bevestigd
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: input_select.select_option
            target:
              entity_id: input_select.ai_kia_laadmodus
            data:
              option: Automatisch
        else:
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: persistent_notification.create
            data:
              notification_id: ai_kia_eenmalig_stop_niet_bevestigd
              title: 'Kia: laadstop nog niet bevestigd'
              message: Het eenmalige laaddoel is bereikt, maar een actuele laadstop is nog niet bevestigd. Handmatig
                blijft actief; de planner controleert opnieuw voordat hij naar Automatisch terugkeert.
  description: 'Nu laden is eenmalig: bij bereikt handmatig doel eerst laadstop bevestigen, daarna terug naar Automatisch.
    Onbereikbaar is niet losgekoppeld; nieuwe bediening tijdens de wachttijd houdt voorrang. Kia-cloudlimiet en
    algemene laadtoestemming blijven ongewijzigd.'
  max_exceeded: silent
  initial_state: false
