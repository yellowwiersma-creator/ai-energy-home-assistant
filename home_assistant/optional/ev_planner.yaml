  - name: AI Kia Directe Laadprijs
    unique_id: ai_kia_directe_laadprijs
    icon: mdi:cash-fast
    unit_of_measurement: €/kWh
    state: "\n{% set rows =\n  state_attr(\n    'sensor.ai_kia_volledige_prijsvoorspelling_uren',\n    'predictions'\n\
      \  )\n  | default([], true)\n%}\n{% set start =\n  as_timestamp(\n    states('input_datetime.ai_kia_sessie_aangesloten_op'),\n\
      \    0\n  )\n%}\n{% set kwh =\n  states('input_number.ai_kia_sessie_kwh_verwacht')\n  | float(0)\n%}\n{% set\
      \ vermogen =\n  states('input_number.ai_kia_laadvermogen_verwacht')\n  | float(10.4)\n%}\n{% set huidige_prijs\
      \ =\n  states('sensor.energy_current_tariff')\n  | float(0)\n%}\n{% if\n  start <= 0\n  or kwh <= 0\n  or\
      \ vermogen <= 0\n  or rows | count == 0\n%}\n\n  unknown\n\n{% else %}\n\n  {% set einde =\n    start + ((kwh\
      \ / vermogen) * 3600)\n  %}\n\n  {% set ns =\n    namespace(\n      kosten=0.0,\n      dekking=0.0,\n    \
      \  actuele_einde=0\n    )\n  %}\n\n  {# Zoek het forecastslot waarin het aansluitmoment valt #}\n\n  {% for\
      \ row in rows %}\n\n    {% set rs =\n      as_timestamp(row.start, 0)\n    %}\n\n    {% set re =\n      as_timestamp(row.end,\
      \ 0)\n    %}\n\n    {% if\n      ns.actuele_einde == 0\n      and rs <= start\n      and re > start\n    %}\n\
      \      {% set ns.actuele_einde = re %}\n    {% endif %}\n\n  {% endfor %}\n\n  {# Als forecast nog niet begonnen\
      \ is, pak eerste toekomstige start #}\n\n  {% if ns.actuele_einde == 0 %}\n\n    {% for row in rows %}\n\n\
      \      {% set rs =\n        as_timestamp(row.start, 0)\n      %}\n\n      {% if\n        ns.actuele_einde\
      \ == 0\n        and rs > start\n      %}\n        {% set ns.actuele_einde = rs %}\n      {% endif %}\n\n \
      \   {% endfor %}\n\n  {% endif %}\n\n  {# Actuele lopende prijsperiode #}\n\n  {% if ns.actuele_einde > start\
      \ %}\n\n    {% set actueel_tot =\n      [einde, ns.actuele_einde] | min\n    %}\n\n    {% if actueel_tot >\
      \ start %}\n\n      {% set seconden =\n        actueel_tot - start\n      %}\n\n      {% set ns.kosten =\n\
      \        ns.kosten\n        + (\n          (seconden / 3600)\n          * vermogen\n          * huidige_prijs\n\
      \        )\n      %}\n\n      {% set ns.dekking =\n        ns.dekking + seconden\n      %}\n\n    {% endif\
      \ %}\n\n  {% endif %}\n\n  {# Resterende forecastperioden #}\n\n  {% for row in rows %}\n\n    {% set rs =\n\
      \      as_timestamp(row.start, 0)\n    %}\n\n    {% set re =\n      as_timestamp(row.end, 0)\n    %}\n\n \
      \   {% set vanaf =\n      [\n        rs,\n        start,\n        ns.actuele_einde\n      ]\n      | max\n\
      \    %}\n\n    {% set tot =\n      [re, einde] | min\n    %}\n\n    {% set overlap =\n      [tot - vanaf,\
      \ 0] | max\n    %}\n\n    {% if overlap > 0 %}\n\n      {% set ns.kosten =\n        ns.kosten\n        + (\n\
      \          (overlap / 3600)\n          * vermogen\n          * (row.price | float(0))\n        )\n      %}\n\
      \n      {% set ns.dekking =\n        ns.dekking + overlap\n      %}\n\n    {% endif %}\n\n  {% endfor %}\n\
      \n  {% set nodig_sec =\n    einde - start\n  %}\n\n  {% if ns.dekking >= nodig_sec - 5 %}\n    {{ (ns.kosten\
      \ / kwh) | round(5) }}\n  {% else %}\n    unknown\n  {% endif %}\n\n{% endif %}\n"
  - name: AI Kia Effectieve Laadprijs Nu
    unique_id: ai_kia_effectieve_laadprijs_nu
    icon: mdi:cash-sync
    unit_of_measurement: €/kWh
    state: "{% set net_status =\n  states('sensor.energy_current_tariff')\n%} {% set zon_status =\n  states('sensor.ai_kia_actuele_terugleverwaarde')\n\
      %} {% set verwacht_w =\n  states('input_number.ai_kia_laadvermogen_verwacht')\n  | float(10.4) * 1000\n%}\
      \ {% set ev_w =\n  states('sensor.ev_charger_power')\n  | float(0)\n%} {% set ev_zon_w =\n  states('sensor.ai_kia_ev_zonvermogen')\n\
      \  | float(0)\n%} {% set overschot_w =\n  [states('sensor.home_grid_export_power') | float(0), 0]\n  | max\n\
      %}\n{% if net_status in ['unknown', 'unavailable', ''] %}\n  unknown\n{% else %}\n  {% set net_prijs = net_status\
      \ | float(0) %}\n  {% set zon_prijs =\n    zon_status | float(net_prijs)\n    if zon_status not in ['unknown',\
      \ 'unavailable', '']\n    else net_prijs\n  %}\n\n  {% if ev_w > 500 %}\n    {% set zon_aandeel =\n      [[ev_zon_w\
