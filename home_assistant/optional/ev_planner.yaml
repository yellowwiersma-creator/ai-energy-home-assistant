- id: ai_kia_laadplanner_agenda_update
  alias: AI Kia laadplanner agenda update
  initial_state: false
  mode: single
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /15
  - trigger: state
    entity_id: input_button.ai_kia_laadplanner_update
  actions:
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: calendar.get_events
      target:
        entity_id: calendar.ev_departures
      data:
        duration:
          days: 14
      response_variable: agenda
  - variables:
      rit_titel: "\n{% set ns =\n  namespace(titel='')\n%}\n{% set events =\n  agenda[\n    'calendar.ev_departures'\n\
        \  ].events\n  | default([])\n%}\n{% for e in events %}\n\n  {% set s =\n    e.summary | default('')\n \
        \ %}\n\n  {% if\n    ns.titel == ''\n    and\n    as_timestamp(\n      e.start | default(''),\n      0\n\
        \    )\n    > as_timestamp(now())\n    and '__EV_CALENDAR_KEYWORD_1__' in s | lower\n    and '__EV_CALENDAR_KEYWORD_2__'\
        \ in s | lower\n  %}\n\n    {% set ns.titel = s %}\n\n  {% endif %}\n\n{% endfor %}\n{{\n  ns.titel\n  if\
        \ ns.titel != ''\n  else 'Geen rit gevonden'\n}}\n"
      rit_start: "\n{% set ns =\n  namespace(start='')\n%}\n{% set events =\n  agenda[\n    'calendar.ev_departures'\n\
        \  ].events\n  | default([])\n%}\n{% for e in events %}\n\n  {% set s =\n    e.summary | default('')\n \
        \ %}\n\n  {% if\n    ns.start == ''\n    and\n    as_timestamp(\n      e.start | default(''),\n      0\n\
        \    )\n    > as_timestamp(now())\n    and '__EV_CALENDAR_KEYWORD_1__' in s | lower\n    and '__EV_CALENDAR_KEYWORD_2__'\
        \ in s | lower\n  %}\n\n    {% set ns.start =\n      e.start | default('')\n    %}\n\n  {% endif %}\n\n\
        {% endfor %}\n{{ ns.start }}\n"
      kia_doel: "\n{% set m =\n  rit_titel\n  | regex_findall('Kia\\\\s*(\\\\d+)')\n%}\n{% if m | count > 0 %}\n\
        \  {{ m[0] | int(80) }}\n{% else %}\n  80\n{% endif %}\n"
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.ai_kia_werkrit_titel
      data:
        value: '{{ rit_titel }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.ai_kia_werkrit_start
      data:
        value: '{{ rit_start }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.ai_kia_doelpercentage
      data:
        value: '{{ kia_doel }}'
  conditions:
  - condition: template
    value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
    alias: Advanced recipe master authorization is still enabled
