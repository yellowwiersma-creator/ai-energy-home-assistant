      \ <= deadline\n      and werkelijk_einde <= horizon\n      and gemiddeld < ns.prijs\n    -%}\n      {%- set\
      \ ns.start = begin -%}\n      {%- set ns.prijs = gemiddeld -%}\n      {%- set ns.gevonden = true -%}\n   \
