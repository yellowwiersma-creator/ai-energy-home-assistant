          message: 'Nu laden is niet gestart omdat Peblar geen aangesloten Kia ziet. Sluit de auto eerst aan en
            druk daarna opnieuw op Nu laden.

            '
  initial_state: false
  conditions:
  - condition: template
    value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
    alias: Advanced recipe master authorization is still enabled
