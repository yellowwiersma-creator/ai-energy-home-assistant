      \    ),\n    0\n  )\n%}\n{{\n  laatste == 0\n  or\n  as_timestamp(now()) - laatste\n  > 1800\n}}\n"
  actions:
  - variables:
      vorige_update: '{{ states(''sensor.ev_cloud_updated_at'') }}

        '
      begin_soc: "{{\n  states(\n    'input_number.ai_kia_sessie_start_soc'\n  )\n  | float(0)\n}}\n"
      begin_energie: "{{\n  states(\n    'input_number.ai_kia_sessie_start_energie'\n  )\n  | float(0)\n}}\n"
      rapport_start_soc: "{{\n  states(\n    'input_number.ai_kia_rapport_start_soc'\n  )\n  | float(0)\n}}\n"
      rapport_start_energie: "{{\n  states(\n    'input_number.ai_kia_rapport_start_energie'\n  )\n  | float(0)\n\
        }}\n"
      oude_kwh_pct: "{{\n  states(\n    'input_number.ai_kia_kwh_per_procent'\n  )\n  | float(0.704)\n}}\n"
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_datetime.set_datetime
