      totale_sessie_kwh: "\n{% set nu =\n  states(\n    'sensor.ev_charger_session_energy'\n  )\n  | float(0)\n\
        %}\n{% if nu >= rapport_start_energie %}\n  {{ nu - rapport_start_energie }}\n{% else %}\n  {{ nu }}\n{%\
        \ endif %}\n"
