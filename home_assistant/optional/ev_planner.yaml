      \ / verwacht_w, 1] | min, 0] | max\n    %}\n  {% else %}\n    {% set zon_aandeel = 0 %}\n  {% endif %}\n\n\
      \  {{\n    (\n      (zon_aandeel * zon_prijs)\n      + ((1 - zon_aandeel) * net_prijs)\n    )\n    | round(7)\n\
      \  }}\n{% endif %}\n"
