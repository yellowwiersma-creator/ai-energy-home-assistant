    - conditions:
      - condition: template
        value_template: "{{\n  bestaand_plan | float(0) > as_timestamp(now()) + 60 and states('input_number.ai_kia_plan_gemiddelde_prijs')\
          \ | float(0) > 0\n  and bestaand_plan_rit == huidige_rit\n  and\n  (\n    bestaand_plan | float(0)\n \
          \   +\n    (huidige_laadduur | float(0)) * 3600\n  )\n  <= huidige_deadline | float(0)\n}}\n"
      sequence:
      - stop: Bestaand laadplan voor deze werkrit blijft vastgezet
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.ai_kia_voorspelling_dekt_deadline
        state: 'on'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.ai_kia_noodplanning_actief
    default:
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
        alias: Advanced recipe master authorization is still enabled
      then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ai_kia_noodplanning_actief
  - variables:
      kandidaat: '{{ states(''sensor.ai_kia_goedkoopste_laadblok'') }}

        '
      kandidaat_prijs: "{{\n  state_attr(\n    'sensor.ai_kia_goedkoopste_laadblok',\n    'gemiddelde_prijs'\n \
        \ )\n  | float(0)\n}}\n"
      rit: '{{ states(''input_text.ai_kia_werkrit_start'') }}

        '
  - condition: template
    value_template: "{{\n  kandidaat not in [\n    '',\n    'unknown',\n    'unavailable',\n    'Geen laden nodig'\n\
      \  ]\n  and\n  as_timestamp(kandidaat, 0) > 0\n}}\n"
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.ai_kia_direct_baseline_vastgezet
        - input_boolean.ai_kia_gepland_baseline_vastgezet
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.ai_kia_vast_plan_start
      data:
        value: '{{ kandidaat }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.ai_kia_plan_rit_start
      data:
        value: '{{ rit }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.ai_kia_plan_gemiddelde_prijs
      data:
        value: "{{\n  kandidaat_prijs\n  if -2 < kandidaat_prijs < 2\n  else 0\n}}\n"
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.ai_kia_plan_blokken
      data:
        value: "{{\n  state_attr(\n    'sensor.ai_kia_goedkoopste_laadblok',\n    'benodigde_blokken'\n  )\n  |\
          \ int(0)\n}}\n"
  - variables:
      plan_kwh: "{{\n  states('sensor.ai_kia_kwh_nodig')\n  | float(0)\n  | round(2)\n}}\n"
      direct_prijs: "{{\n  states('sensor.ai_kia_directe_laadprijs')\n  | float(0)\n}}\n"
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.ai_kia_sessie_kwh_verwacht
      data:
        value: '{{ plan_kwh }}'
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  states('sensor.ai_kia_directe_laadprijs')\n  not in ['unknown', 'unavailable', '']\n\
          \  and plan_kwh | float(0) > 0\n}}\n"
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.ai_kia_direct_gemiddelde_prijs
          data:
            value: '{{ direct_prijs }}'
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.ai_kia_kosten_direct
          data:
            value: "{{\n  ((direct_prijs | float(0)) * (plan_kwh | float(0)))\n  | round(3)\n}}\n"
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.ai_kia_direct_baseline_vastgezet
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.ai_kia_gepland_gemiddelde_prijs
      data:
        value: '{{ kandidaat_prijs }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.ai_kia_kosten_gepland
      data:
        value: "{{\n  ((kandidaat_prijs | float(0)) * (plan_kwh | float(0)))\n  | round(3)\n}}\n"
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ai_kia_gepland_baseline_vastgezet
  initial_state: false
