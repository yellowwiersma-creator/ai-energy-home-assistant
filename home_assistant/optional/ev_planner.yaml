        }}

        '
      zon_aandeel: "{% set verwacht_w =\n  states('input_number.ai_kia_laadvermogen_verwacht')\n  | float(10.4)\
        \ * 1000\n%} {% set ev_w =\n  states('sensor.ev_charger_power')\n  | float(0)\n%} {% set ev_zon_w =\n  states('sensor.ai_kia_ev_zonvermogen')\n\
        \  | float(0)\n%} {% set overschot_w =\n  [states('sensor.home_grid_export_power') | float(0), 0]\n  | max\n\
        %} {% if ev_w > 500 %}\n  {{ [[ev_zon_w / ev_w, 1] | min, 0] | max | round(4) }}\n{% elif verwacht_w > 0\
        \ %}\n  {{ [[overschot_w / verwacht_w, 1] | min, 0] | max | round(4) }}\n{% else %}\n  0\n{% endif %}\n"
      bron_zonaandeel: "{% if states('sensor.ev_charger_power') | float(0) > 500 %}\n  gemeten_tijdens_laden\n{%\
        \ else %}\n  beschikbaar_netoverschot\n{% endif %}\n"
