            message: 'Handmatig doel is {{ handmatig_doel | round(0) }}%, maar de Kia AC-laadlimiet staat op {{
              kia_limiet | round(0) }}%. De laadlimiet wordt bewust alleen bij aansluiten gesynchroniseerd. Stel
              het gewenste doel daarom vóór de volgende aansluiting in en sluit de Kia opnieuw aan.

              '
    default:
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
        alias: Advanced recipe master authorization is still enabled
