      \ bevestigd_op =\n  states('input_datetime.ai_kia_soc_laatst_bevestigd_op')\n%}\n{% set verbonden =\n  states('sensor.ev_charger_status')\n\
      \  in ['suspended', 'charging']\n%}\n{{\n  is_state(\n    'input_boolean.ai_kia_soc_bevestigd',\n    'on'\n\
      \  )\n  and\n  is_state(\n    'input_boolean.ai_kia_sessie_actief',\n    'on'\n  )\n  and verbonden\n  and\
      \ bevestigd_op not in [\n    'unknown',\n    'unavailable',\n    ''\n  ]\n  and as_timestamp(bevestigd_op,\
      \ 0) > 0\n}}\n\n{% endif %}"
  - name: AI Kia Handmatig Plan Haalbaar
    unique_id: ai_kia_handmatig_plan_haalbaar
    icon: mdi:clock-check-outline
    state: "{% set einde =\n  as_timestamp(\n    states('input_text.ai_kia_handmatig_plan_einde'),\n    0\n  )\n\
      %} {% set laaduren =\n  states('sensor.ai_kia_laaduren_nodig_verwacht')\n  | float(0)\n%} {% set blokken =\n\
      \  (laaduren * 4)\n  | round(0, 'ceil')\n  | int(0)\n%} {% set nodig_sec = blokken * 900 %} {{\n  is_state('input_select.ai_kia_laadmodus',\
      \ 'Klaar om')\n  and einde > 0\n  and\n  (\n    laaduren <= 0\n    or as_timestamp(now()) + nodig_sec <= einde\
      \ + 60\n  )\n}}\n"
    attributes:
      gewenst_einde: '{{ states(''input_text.ai_kia_handmatig_plan_einde'') }}

        '
      berekende_start: '{{ states(''input_text.ai_kia_vast_plan_start'') }}

        '
      benodigde_kwartieren: "{{\n  (\n    states('sensor.ai_kia_laaduren_nodig_verwacht')\n    | float(0)\n    *\
        \ 4\n  )\n  | round(0, 'ceil')\n  | int(0)\n}}\n"
  - name: AI Kia Nu Laden Voordeliger
    unique_id: ai_kia_nu_laden_voordeliger
    icon: mdi:cash-check
    state: "{% set nu_status =\n  states('sensor.ai_kia_nu_laden_gemiddelde_prijs')\n%} {% set plan_start =\n  as_timestamp(\n\
      \    states('input_text.ai_kia_vast_plan_start'),\n    0\n  )\n%} {% set plan_prijs =\n  states('input_number.ai_kia_plan_gemiddelde_prijs')\n\
      \  | float(0)\n%} {% set plan_blokken =\n  states('input_number.ai_kia_plan_blokken')\n  | int(0)\n%} {% set\
      \ deadline =\n  as_timestamp(\n    state_attr(\n      'sensor.ai_kia_goedkoopste_laadblok',\n      'deadline'\n\
      \    ),\n    0\n  )\n%} {% set laaduren =\n  states('sensor.ai_kia_laaduren_nodig_verwacht')\n  | float(0)\n\
      %}\n{{\n  is_state('input_boolean.ai_kia_sessie_actief', 'on')\n  and is_state('binary_sensor.ai_kia_soc_is_betrouwbaar',\
      \ 'on')\n  and states('sensor.ev_charger_status') == 'suspended'\n  and states('sensor.ai_kia_kwh_nodig')\
      \ | float(0) > 0.1\n  and nu_status not in ['unknown', 'unavailable', '']\n  and plan_start > as_timestamp(now())\
      \ + 60\n  and plan_blokken > 0\n  and deadline > 0\n  and as_timestamp(now()) + (laaduren * 3600) <= deadline\n\
      \  and (nu_status | float(99)) <= plan_prijs\n}}\n"
    attributes:
      gemiddelde_prijs_nu: '{{ states(''sensor.ai_kia_nu_laden_gemiddelde_prijs'') }}

        '
      gemiddelde_prijs_plan: '{{ states(''input_number.ai_kia_plan_gemiddelde_prijs'') }}

        '
      effectieve_prijs_nu: '{{ states(''sensor.ai_kia_effectieve_laadprijs_nu'') }}

        '
      voordeel_ct_kwh: "{% set nu = states('sensor.ai_kia_nu_laden_gemiddelde_prijs') %} {% set plan = states('input_number.ai_kia_plan_gemiddelde_prijs')\
        \ | float(0) %} {% if nu not in ['unknown', 'unavailable', ''] %}\n  {{ ((plan - (nu | float(0))) * 100)\
        \ | round(2) }}\n{% else %}\n  0\n{% endif %}\n"
      vast_plan_start: '{{ states(''input_text.ai_kia_vast_plan_start'') }}

        '
  - name: AI Kia Laden Nodig
    unique_id: ai_kia_laden_nodig
    icon: mdi:battery-alert
    state: "{{\n  states('sensor.ai_kia_procent_nodig')\n  | float(0)\n  > 0\n}}\n"
  - name: AI Kia Auto Kan Laden
    unique_id: ai_kia_auto_kan_laden
    icon: mdi:ev-plug-type2
    state: "\n{{\n  states('sensor.ev_charger_status')\n  in ['suspended', 'charging']\n  and\n  states('sensor.ai_kia_procent_nodig')\n\
      \  | float(0)\n  > 0\n}}\n"
  - name: AI Kia Laaddoel In Gevaar
    unique_id: ai_kia_laaddoel_in_gevaar
    icon: mdi:alert-circle
    state: "\n{% set deadline =\n  as_timestamp(\n    state_attr(\n      'sensor.ai_kia_goedkoopste_laadblok',\n\
      \      'deadline'\n    ),\n    0\n  )\n%}\n{% set gepland =\n  as_timestamp(\n    states('input_text.ai_kia_vast_plan_start'),\n\
      \    0\n  )\n%}\n{% set resterend_kwh =\n  states('sensor.ai_kia_kwh_nodig')\n  | float(0)\n%}\n{% set resterend_sec\
      \ =\n  deadline - as_timestamp(now())\n%}\n{% set vermogen =\n  states('input_number.ai_kia_laadvermogen_verwacht')\n\
      \  | float(10.4)\n%}\n{% set nodig_sec =\n  (\n    resterend_kwh\n    / vermogen\n    * 3600\n  )\n  if vermogen\
      \ > 0\n  else 999999\n%}\n{% set actueel_vermogen =\n  states('sensor.ev_charger_power')\n  | float(0)\n%}\n\
      {{\n  is_state(\n    'input_boolean.ai_kia_automatisch_laden_toestaan',\n    'on'\n  )\n  and\n  is_state(\n\
      \    'input_boolean.ai_kia_sessie_actief',\n    'on'\n  )\n  and\n  is_state(\n    'binary_sensor.ai_kia_soc_is_betrouwbaar',\n\
      \    'on'\n  )\n  and resterend_kwh > 0.5\n  and deadline > 0\n  and\n  (\n    resterend_sec <= nodig_sec\
      \ + 900\n    or\n    (\n      gepland > 0\n      and as_timestamp(now()) > gepland + 300\n      and actueel_vermogen\
      \ < 5000\n    )\n  )\n}}\n"
  - name: AI Kia Voorspelling Dekt Deadline
    unique_id: ai_kia_voorspelling_dekt_deadline
    icon: mdi:timeline-check
    state: "\n{% set rows =\n  state_attr(\n    'sensor.ai_kia_volledige_prijsvoorspelling_uren',\n    'predictions'\n\
      \  )\n  | default([], true)\n%}\n{% set vertrek =\n  as_timestamp(\n    states('input_text.ai_kia_werkrit_start'),\n\
      \    0\n  )\n%}\n{% set deadline =\n  vertrek - 1800\n%}\n{{\n  rows | count > 0\n  and deadline > 0\n  and\
      \ as_timestamp(rows[-1].end, 0) >= deadline\n}}\n"
  - name: AI Kia Geschat Doel Bereikt
    unique_id: ai_kia_geschat_doel_bereikt
    icon: mdi:battery-check
    state: "\n{% set doel =\n  states('sensor.ai_kia_effectief_doelpercentage')\n  | float(80)\n%}\n{% set soc =\n\
      \  states('sensor.ai_kia_soc_betrouwbaar')\n  | float(0)\n%}\n{{\n  is_state(\n    'binary_sensor.ai_kia_soc_is_betrouwbaar',\n\
      \    'on'\n  )\n  and soc >= doel\n}}\n"
  - name: AI Kia 100 Procent Onderhoud Nodig
    unique_id: ai_kia_100_procent_onderhoud_nodig
    icon: mdi:battery-sync
    state: "\n{% set laatste =\n  as_timestamp(\n    states(\n      'input_datetime.ai_kia_laatst_100_procent_op'\n\
      \    ),\n    0\n  )\n%}\n{{\n  laatste > 0\n  and\n  (\n    as_timestamp(now()) - laatste\n  )\n  >=\n  (30\
      \ * 86400)\n}}\n"
- triggers:
  - trigger: time_pattern
    seconds: /15
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - sensor.ev_cloud_soc
    - sensor.ev_cloud_updated_at
    - binary_sensor.ev_cloud_charging
    - sensor.ai_kia_effectief_doelpercentage
    - number.ev_cloud_ac_limit
    for: 00:00:05
  - trigger: state
    entity_id:
    - input_datetime.ai_kia_sessie_aangesloten_op
    - input_boolean.ai_kia_sessie_actief
    - sensor.ev_charger_status
  actions:
  - variables:
      result: "\n{% set old=state_attr('sensor.ai_kia_laaddoel_bevestiging','model') or {} %}\n{% set now_ts=as_timestamp(now())\
        \ %}\n{% set session=states('input_datetime.ai_kia_sessie_aangesloten_op') %}\n{% set session_ts=as_timestamp(session,0)\
        \ %}\n{% set plugged=states('sensor.ev_charger_status') in ['suspended','charging'] and is_state('input_boolean.ai_kia_sessie_actief','on')\
        \ %}\n{% set disconnected=is_state('sensor.ev_charger_status','no_ev_connected') or is_state('input_boolean.ai_kia_sessie_actief','off')\
        \ %}\n{% set wican=is_state('binary_sensor.ai_kia_wican_soc_actueel', 'on') %}\n{% set soc=states('sensor.ai_kia_wican_soc'\
        \ if wican else 'sensor.ev_cloud_soc')|float(-1) %}\n{% set goal=states('sensor.ai_kia_effectief_doelpercentage')|float(-1)\
        \ %}\n{% set updated=state_attr('sensor.ai_kia_wican_soc','ontvangen_op')|float(0) if wican else as_timestamp(states('sensor.ev_cloud_updated_at'),0)\
        \ %}\n{% set power=states('sensor.ev_charger_power')|float(-1) %}\n{% set power_fresh=now_ts-as_timestamp(states.sensor.ev_charger_power.last_reported,0)<180\
        \ %}\n{% set fresh=0<=soc<=100 and updated>=session_ts and 0<=now_ts-updated<=1800 %}\n{% set n=namespace(soc=none,\
        \ at=0) %}\n{# A completion belongs only to this physical plug-in session. It survives cloud silence. #}\n\
        {% if not disconnected and session_ts>0 and old.get('session')==session %}\n  {% set n.soc=old.get('soc')\
        \ %}{% set n.at=old.get('at',0) %}\n{% endif %}\n{# Newer lower vehicle SOC invalidates an earlier completion,\
        \ including after cabin use. #}\n{% if fresh and updated>=n.at and n.soc is number and soc<n.soc %}\n  {%\
        \ set n.soc=none %}{% set n.at=0 %}\n{% endif %}\n{% if plugged and session_ts>0 and fresh and 1<=goal<=100\
        \ and soc>=goal and is_state('binary_sensor.ev_cloud_charging','off') and is_state('binary_sensor.ev_cloud_plugged','on')\
        \ and is_state('sensor.ev_charger_status','suspended') and power_fresh and 0<=power<100 %}\n  {% set n.soc=soc\
        \ %}{% set n.at=updated %}\n{% endif %}\n\n{% set goal=states('sensor.ai_kia_effectief_doelpercentage')|float(-1)\
        \ %}\n{% set estimate=states('sensor.ai_kia_soc_betrouwbaar')|float(-1) %}\n{% set limit=states('number.ev_cloud_ac_limit')|float(-1)\
        \ %}\n{% set near=1<=goal<=100 and 0<=estimate<=100 and estimate>=goal-1 and limit==goal %}\n\n{% set same=old.get('session')==session\
        \ and old.get('goal')==goal and not disconnected %}\n{% set held=same and old.get('hold',false) %}\n{% set\
        \ hold_at=old.get('hold_at',0) if held else 0 %}\n{% set lower=fresh and soc<goal-1 %}\n{% if lower and\
        \ updated>=hold_at %}{% set held=false %}{% endif %}\n{% set energy=states('sensor.ev_charger_session_energy')|float(-1)\
        \ %}\n{% set baseline=states('input_number.ai_kia_sessie_start_energie')|float(-1) %}\n{% set charged=energy-baseline\
        \ if energy>=baseline else energy %}\n{% set low=plugged and near and not lower and baseline>=0 and charged>0.05\
        \ and is_state('sensor.ev_charger_status','suspended') and is_state('switch.ev_charger_authorize','on')\
        \ and power_fresh and 0<=power<100 %}\n{% set since=old.get('low_since',0) if same and low else 0 %}\n{%\
        \ if low and since<=0 %}{% set since=now_ts %}{% endif %}\n{% if low and now_ts-since>=120 %}{% set held=true\
        \ %}{% set hold_at=updated %}{% endif %}\n{% set complete=plugged and n.soc is number and 1<=goal<=100 and\
        \ n.soc>=goal %}\n{% if complete %}{% set held=false %}{% endif %}\n{{ dict(session='' if disconnected else\
        \ session, soc=n.soc, at=n.at, complete=complete, goal=goal, observed=now_ts, hold=held, hold_at=hold_at,\
        \ low_since=since) }}\n"
  sensor:
  - name: AI Kia Laaddoel Bevestiging
    unique_id: ai_kia_laaddoel_bevestiging
    state: '{{ ''Bevestigd door Kia'' if result.complete else ''Wacht op Kia'' if result.hold else ''Niet bevestigd''
      }}'
    icon: mdi:battery-check
    attributes:
      model: '{{ result }}'
- triggers:
  - trigger: state
    entity_id: sensor.ev_obd_uptime
    id: webhook
  - trigger: homeassistant
    event: start
    id: restart
  actions:
  - delay: 00:00:01
  - variables:
      geldig: "{{ trigger.id == 'webhook'\n   and trigger.from_state is not none\n   and trigger.to_state is not\
        \ none\n   and trigger.from_state.state not in ['unknown', 'unavailable', '']\n   and trigger.to_state.state\
        \ not in ['unknown', 'unavailable', '']\n   and trigger.from_state.state != trigger.to_state.state\n   and\
        \ is_state('binary_sensor.ev_obd_ecu_online', 'on')\n   and states('sensor.ev_obd_12v') | float(0) >= 13.1\n\
        \   and is_number(states('sensor.ev_obd_soc_display'))\n   and 0 <= states('sensor.ev_obd_soc_display')\
        \ | float(-1) <= 100 }}"
  sensor:
  - name: AI Kia WiCAN SOC
    unique_id: ai_kia_wican_soc
    default_entity_id: sensor.ai_kia_wican_soc
    device_class: battery
    state_class: measurement
    unit_of_measurement: '%'
    icon: mdi:car-battery
    state: "{{ states('sensor.ev_obd_soc_display') | float | round(1)\n   if geldig else this.state | float(none)\
      \ }}"
    attributes:
      ontvangen_op: '{{ as_timestamp(now()) if geldig else 0 }}'
      bron: sensor.ev_obd_soc_display
- binary_sensor:
  - name: AI Kia WiCAN SOC Actueel
    unique_id: ai_kia_wican_soc_actueel
    default_entity_id: binary_sensor.ai_kia_wican_soc_actueel
    icon: mdi:check-network
    state: "{% set age = as_timestamp(now()) - state_attr('sensor.ai_kia_wican_soc', 'ontvangen_op') | float(0)\
      \ %} {{ 0 <= age < 120\n   and is_number(states('sensor.ai_kia_wican_soc'))\n   and 0 <= states('sensor.ai_kia_wican_soc')\
      \ | float(-1) <= 100\n   and is_state('binary_sensor.ev_obd_ecu_online', 'on')\n   and states('sensor.ev_obd_12v')\
      \ | float(0) >= 13.1 }}"
script:
  ai_kia_kosten_en_energie_bijwerken:
    alias: AI Kia kosten en energie bijwerken
    icon: mdi:calculator-variant
    mode: queued
    max: 25
    sequence:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    - condition: state
      entity_id: input_boolean.ai_kia_sessie_actief
      state: 'on'
    - variables:
        huidige_energie: "{{\n  states(\n    'sensor.ev_charger_session_energy'\n  )\n  | float(0)\n}}\n"
        vorige_energie: "{{\n  states(\n    'input_number.ai_kia_kosten_interval_start_energie'\n  )\n  | float(0)\n\
          }}\n"
        delta_kwh: "{% set nu =\n  states(\n    'sensor.ev_charger_session_energy'\n  )\n  | float(0)\n%} {% set\
          \ vorig =\n  states(\n    'input_number.ai_kia_kosten_interval_start_energie'\n  )\n  | float(0)\n%} {{\n\
          \  (nu - vorig)\n  if nu >= vorig\n  else 0\n}}\n"
        ev_vermogen: "{{\n  states('sensor.ev_charger_power')\n  | float(0)\n}}\n"
        gemeten_netvermogen: "{{\n  states('sensor.ai_kia_ev_netvermogen')\n  | float(0)\n}}\n"
        vorig_net_aandeel: "{{\n  states('input_number.ai_kia_net_aandeel_laatst')\n  | float(1)\n}}\n"
        net_aandeel: "{% set ev =\n  states('sensor.ev_charger_power')\n  | float(0)\n%} {% set net =\n  states('sensor.ai_kia_ev_netvermogen')\n\
          \  | float(0)\n%} {% set vorig =\n  states('input_number.ai_kia_net_aandeel_laatst')\n  | float(1)\n%}\
          \ {% if ev > 500 %}\n  {{ [[net / ev, 1] | min, 0] | max }}\n{% else %}\n  {{ [[vorig, 1] | min, 0] |\
          \ max }}\n{% endif %}\n"
        delta_net_kwh: "{{\n  (delta_kwh | float(0))\n  * (net_aandeel | float(1))\n}}\n"
        delta_zon_kwh: "{{\n  (delta_kwh | float(0))\n  * (1 - (net_aandeel | float(1)))\n}}\n"
        oude_netprijs: "{{\n  states('input_number.ai_kia_kosten_interval_prijs')\n  | float(0)\n}}\n"
        oude_zonprijs: "{{\n  states(\n    'input_number.ai_kia_kosten_interval_zonprijs'\n  )\n  | float(oude_netprijs\
          \ | float(0))\n}}\n"
        nieuwe_netprijs: "{% set prijs =\n  states('sensor.energy_current_tariff')\n%} {{\n  prijs | float(oude_netprijs\
          \ | float(0))\n  if prijs not in ['unknown', 'unavailable', '']\n  else oude_netprijs | float(0)\n}}\n"
        nieuwe_zonprijs: "{% set prijs =\n  states('sensor.ai_kia_actuele_terugleverwaarde')\n%} {{\n  prijs | float(nieuwe_netprijs\
          \ | float(0))\n  if prijs not in ['unknown', 'unavailable', '']\n  else nieuwe_netprijs | float(0)\n}}\n"
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ delta_kwh | float(0) > 0.0001 }}

            '
        sequence:
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ai_kia_sessie_net_kwh
            data:
              value: "{{\n  (\n    states('input_number.ai_kia_sessie_net_kwh')\n    | float(0)\n  )\n  + (delta_net_kwh\
                \ | float(0))\n}}\n"
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ai_kia_sessie_zon_kwh
            data:
              value: "{{\n  (\n    states('input_number.ai_kia_sessie_zon_kwh')\n    | float(0)\n  )\n  + (delta_zon_kwh\
                \ | float(0))\n}}\n"
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ai_kia_kosten_net
            data:
              value: "{{\n  (\n    states('input_number.ai_kia_kosten_net')\n    | float(0)\n  )\n  +\n  (delta_net_kwh\
                \ | float(0))\n  * (oude_netprijs | float(0))\n}}\n"
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ai_kia_kosten_zon_gemist
            data:
              value: "{{\n  (\n    states('input_number.ai_kia_kosten_zon_gemist')\n    | float(0)\n  )\n  +\n \
                \ (delta_zon_kwh | float(0))\n  * (oude_zonprijs | float(0))\n}}\n"
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
            alias: Advanced recipe master authorization is still enabled
          then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ai_kia_kosten_werkelijk
            data:
              value: "{{\n  (\n    states('input_number.ai_kia_kosten_werkelijk')\n    | float(0)\n  )\n  +\n  (delta_net_kwh\
                \ | float(0))\n  * (oude_netprijs | float(0))\n  +\n  (delta_zon_kwh | float(0))\n  * (oude_zonprijs\
                \ | float(0))\n}}\n"
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
        alias: Advanced recipe master authorization is still enabled
      then:
      - action: input_number.set_value
        target:
          entity_id: input_number.ai_kia_kosten_interval_start_energie
        data:
          value: '{{ huidige_energie }}'
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
        alias: Advanced recipe master authorization is still enabled
      then:
      - action: input_number.set_value
        target:
          entity_id: input_number.ai_kia_kosten_interval_prijs
        data:
          value: '{{ nieuwe_netprijs }}'
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
        alias: Advanced recipe master authorization is still enabled
      then:
      - action: input_number.set_value
        target:
          entity_id: input_number.ai_kia_kosten_interval_zonprijs
        data:
          value: '{{ nieuwe_zonprijs }}'
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
        alias: Advanced recipe master authorization is still enabled
      then:
      - action: input_number.set_value
        target:
          entity_id: input_number.ai_kia_net_aandeel_laatst
        data:
          value: '{{ net_aandeel }}'
automation:
- id: ai_kia_financiele_helpers_initialiseren
  alias: AI Kia financiële helpers initialiseren
  mode: single
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
