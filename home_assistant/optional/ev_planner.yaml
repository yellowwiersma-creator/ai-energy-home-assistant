        \ = false -%}\n      {%- endif -%}\n      {%- set overlap = [([re, werkelijk_einde] | min) - rs, 0] | max\
        \ -%}\n      {%- set gewicht = overlap / 3600 -%}\n      {%- if gewicht > 0 -%}\n        {%- set w.kosten\
        \ = w.kosten + ((rows[i + j].price | float(99)) * gewicht) -%}\n        {%- set w.gewicht = w.gewicht +\
