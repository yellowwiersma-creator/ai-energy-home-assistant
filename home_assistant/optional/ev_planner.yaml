- id: ai_kia_handmatig_vaste_start_toepassen
  alias: AI Kia handmatig gereed om toepassen
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_button.ai_kia_handmatig_plan_toepassen
  - trigger: state
    entity_id: input_datetime.ai_kia_handmatige_eindtijd
    for: 00:00:02
  actions:
  - variables:
      gekozen_tijd: '{{ states(''input_datetime.ai_kia_handmatige_eindtijd'') }}

        '
      gewenst_einde: "{% set kandidaat =\n  today_at(\n    states('input_datetime.ai_kia_handmatige_eindtijd')\n\
        \  )\n%} {% if as_timestamp(kandidaat) <= as_timestamp(now()) + 60 %}\n  {{\n    as_timestamp(kandidaat\
        \ + timedelta(days=1))\n    | timestamp_utc\n  }}\n{% else %}\n  {{\n    as_timestamp(kandidaat)\n    |\
        \ timestamp_utc\n  }}\n{% endif %}\n"
      laaduren: '{% set soc = states(''sensor.ev_cloud_soc'') | float(0) %} {% set doel = states(''input_number.ai_kia_handmatig_doelpercentage'')
        | float(80) %} {% set kwh_pct = states(''input_number.ai_kia_kwh_per_procent'') | float(0.704) %} {% set
        vermogen = states(''input_number.ai_kia_laadvermogen_verwacht'') | float(10.4) %} {{ (([doel - soc, 0] |
        max) * kwh_pct / vermogen) if vermogen > 0 else 0 }}

        '
      plan_blokken: "{{\n  (\n    laaduren\n    | float(0)\n    * 4\n  )\n  | round(0, 'ceil')\n  | int(0)\n}}\n"
      verbonden: "{{\n  states('sensor.ev_charger_status')\n  in ['suspended', 'charging']\n}}\n"
      handmatig_doel: "{{\n  states('input_number.ai_kia_handmatig_doelpercentage')\n  | float(80)\n}}\n"
      kia_limiet: "{{\n  states('number.ev_cloud_ac_limit')\n  | float(-1)\n}}\n"
  - variables:
      berekende_start_ts: '{%- set rows = state_attr(''sensor.ai_kia_volledige_prijsvoorspelling_uren'', ''predictions'')
        | default([], true) -%} {%- set einde = as_timestamp(gewenst_einde, 0) -%} {%- set uren = laaduren | float(0)
        -%} {%- set slots = plan_blokken | int(0) -%} {%- set horizon = as_timestamp(rows[-1].end, 0) if rows |
        count > 0 else 0 -%} {%- set ns = namespace(start=0, prijs=999, gevonden=false) -%} {%- if uren > 0 and
        slots > 0 and rows | count >= slots -%} {%- for i in range(0, rows | count - slots + 1) -%} {%- set begin
        = as_timestamp(rows[i].start, 0) -%} {%- set werkelijke_einde = begin + (uren * 3600) -%} {%- set w = namespace(kosten=0.0,
        gewicht=0.0, aaneen=true) -%} {%- for j in range(0, slots) -%} {%- set rs = as_timestamp(rows[i + j].start,
        0) -%} {%- set re = as_timestamp(rows[i + j].end, 0) -%} {%- if j > 0 and as_timestamp(rows[i + j - 1].end,
        0) != rs -%} {%- set w.aaneen = false -%} {%- endif -%} {%- set overlap = [([re, werkelijke_einde] | min)
        - rs, 0] | max -%} {%- set gewicht = overlap / 3600 -%} {%- if gewicht > 0 -%} {%- set w.kosten = w.kosten
        + ((rows[i + j].price | float(99)) * gewicht) -%} {%- set w.gewicht = w.gewicht + gewicht -%} {%- endif
        -%} {%- endfor -%} {%- set gemiddelde = (w.kosten / w.gewicht) if w.gewicht > 0 else 999 -%} {%- if w.aaneen
        and begin >= as_timestamp(now()) and werkelijke_einde <= einde and werkelijke_einde <= horizon and gemiddelde
        < ns.prijs -%} {%- set ns.start = begin -%} {%- set ns.prijs = gemiddelde -%} {%- set ns.gevonden = true
        -%} {%- endif -%} {%- endfor -%} {%- endif -%} {%- set raw = einde - (slots * 900) -%} {{ ns.start if ns.gevonden
        else [(((raw / 900) | int) * 900), as_timestamp(now())] | max }}

        '
      plan_haalbaar: "{{\n  laaduren | float(0) <= 0\n  or\n  berekende_start_ts | float(0)\n  >= as_timestamp(now())\
        \ - 60\n}}\n"
  - variables:
      vaste_start: "{% if plan_haalbaar | bool %}\n  {{\n    berekende_start_ts\n    | float(0)\n    | timestamp_utc\n\
        \  }}\n{% else %}\n  {{\n    as_timestamp(now())\n    | timestamp_utc\n  }}\n{% endif %}\n"
      verwacht_klaar_ts: "{% if plan_haalbaar | bool %}\n  {{ as_timestamp(gewenst_einde, 0) }}\n{% else %}\n  {{\n\
        \    as_timestamp(now())\n    + ((plan_blokken | int(0)) * 900)\n  }}\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  verbonden\n  and kia_limiet >= 0\n  and handmatig_doel > kia_limiet + 0.5\n}}\n"
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: persistent_notification.create
          data:
            notification_id: ai_kia_vaste_tijd_doel_boven_kia_limiet
            title: Kia-laaddoel eerst bij aansluiting instellen
            message: 'Het handmatige plan is niet toegepast. Handmatig doel is {{ handmatig_doel | round(0) }}%,
              terwijl de Kia AC-laadlimiet op {{ kia_limiet | round(0) }}% staat. De Kia-laadlimiet wordt alleen
              bij aansluiten gesynchroniseerd. Stel het doel vóór de volgende aansluiting in en sluit de Kia opnieuw
              aan.

              '
      - stop: Handmatig doel ligt boven de reeds gesynchroniseerde Kia-limiet
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.ai_kia_direct_laden_actief
        - input_boolean.ai_kia_100_procent_onderhoud_actief
        - input_boolean.ai_kia_noodplanning_actief
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_select.select_option
      target:
        entity_id: input_select.ai_kia_laadmodus
      data:
        option: Klaar om
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ai_kia_automatisch_laden_toestaan
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.ai_kia_handmatig_plan_einde
      data:
        value: '{{ gewenst_einde }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.ai_kia_vast_plan_start
      data:
        value: '{{ vaste_start }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.ai_kia_plan_rit_start
      data:
        value: HANDMATIG
  - if:
    - condition: template
      value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
      alias: Advanced recipe master authorization is still enabled
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.ai_kia_plan_blokken
      data:
        value: '{{ plan_blokken | int(0) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not (plan_haalbaar | bool) and laaduren | float(0) > 0 }}

          '
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: persistent_notification.create
          data:
            notification_id: ai_kia_handmatig_eindtijd_niet_haalbaar
            title: Gewenste eindtijd niet haalbaar
            message: '{{ handmatig_doel | round(0) }}% is niet meer haalbaar vóór {{ as_timestamp(gewenst_einde,
              0) | timestamp_custom(''%d-%m %H:%M'', true) }}. De planner start daarom zo snel mogelijk. Verwacht
              klaar rond {{ verwacht_klaar_ts | float(0) | timestamp_custom(''%d-%m %H:%M'', true) }}.

              '
    default:
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
        alias: Advanced recipe master authorization is still enabled
      then:
      - action: persistent_notification.dismiss
        data:
          notification_id: ai_kia_handmatig_eindtijd_niet_haalbaar
  - delay: 00:00:02
  - variables:
      plan_prijs_status: '{{ states(''sensor.ai_kia_handmatig_plan_gemiddelde_prijs'') }}

        '
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  plan_prijs_status\n  not in ['unknown', 'unavailable', '']\n}}\n"
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
          alias: Advanced recipe master authorization is still enabled
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.ai_kia_plan_gemiddelde_prijs
          data:
            value: '{{ plan_prijs_status | float(0) }}

              '
    default:
    - if:
      - condition: template
        value_template: '{{ is_state(''input_boolean.ai_energy_actuation_enabled'', ''on'') }}'
        alias: Advanced recipe master authorization is still enabled
      then:
      - action: input_number.set_value
        target:
          entity_id: input_number.ai_kia_plan_gemiddelde_prijs
        data:
