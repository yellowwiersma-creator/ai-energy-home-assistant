              \ }}\n\nGemiddelde geplande prijs:\n{{ (gepland_prijs | float(0) * 100) | round(2) }} ct/kWh\n{% else\
              \ %}\nGeplande kosten:\nNiet beschikbaar\n{% endif %}\n\n\nWerkelijke laadkosten:\n€ {{ werkelijke_kosten_eind\
              \ | float(0) | round(2) }}\n\nDit totaal bestaat uit betaalde netstroom plus de\ngemiste terugleverwaarde\
