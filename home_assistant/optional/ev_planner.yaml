      delta_soc: "{{\n  states('sensor.ev_cloud_soc')\n  | float(0)\n  - begin_soc\n}}\n"
      delta_kwh: "\n{% set nu =\n  states(\n    'sensor.ev_charger_session_energy'\n  )\n  | float(0)\n%}\n{% if\
